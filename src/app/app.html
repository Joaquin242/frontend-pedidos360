<div style="text-align: center; margin-top: 50px; font-family: sans-serif;">
  <h1>Sistema Pedidos360</h1>
  
  <div *ngIf="!loginDisplay">
    <p>Por favor, inicia sesión con tu cuenta institucional para continuar.</p>
    <button (click)="login()" style="padding: 10px 20px; font-size: 16px;">Iniciar Sesión</button>
  </div>

  <div *ngIf="loginDisplay">
    <p>¡Autenticación exitosa!</p>
    <button (click)="logout()" style="padding: 10px 20px; font-size: 16px; background-color: #f44336; color: white; border: none;">Cerrar Sesión</button>
    <hr style="margin: 30px 0;">
    <router-outlet></router-outlet>
  </div>
</div>
